<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>American Culture — Ôn tập 300 câu trắc nghiệm</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>

header{background:var(--ink);color:#f6efe0;padding:28px 20px;text-align:center;border-bottom:4px solid var(--accent)}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:28px}
.mode,.unit-btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.mode:hover,.unit-btn:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.mode h3{margin:0 0 4px;font-size:1.05rem;color:var(--accent)}.mode p{margin:0;color:var(--mute);font-size:.92rem}

.units{display:grid;gap:10px}.unit-btn{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px}
.unit-btn b{font-family:'Libre Baskerville',serif;font-size:.98rem}.unit-btn small{color:var(--mute);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar div{height:100%;background:var(--accent);transition:.3s}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.9rem;color:var(--mute);margin:10px 0 14px}

.unit{margin:0 0 8px;font-size:.78rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:700}

.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:.12s}
.opt b{flex:0 0 30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:.9rem}
.opt:not(:disabled):hover{border-color:var(--ink);background:#fbfaf6}.opt:disabled{cursor:default;color:inherit}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad b{background:var(--bad);color:#fff;border-color:var(--bad)}
.verdict{margin:18px 0 10px;padding:10px 14px;border-radius:6px;font-weight:700}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.bad{background:var(--badbg);color:var(--bad)}
.ex{border-left:4px solid var(--accent);background:#fcfaf4;padding:12px 16px;border-radius:0 6px 6px 0}
.ex h4{margin:12px 0 4px;font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}.ex h4:first-child{margin-top:0}
.ex p{margin:2px 0}.vi{color:#33415c;font-style:italic}.dim{color:var(--mute);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:.92rem}.chip b{color:var(--accent)}
nav.ctl{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 20px;font:600 1rem 'Source Sans 3',sans-serif;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}.btn:disabled{opacity:.35;cursor:default}.btn:not(:disabled):hover{background:var(--accent);color:#fff}
.score{text-align:center;padding:30px 10px}.score .big{font:700 3.2rem 'Libre Baskerville',serif;color:var(--accent)}
.wrong li{margin:6px 0}.wrong{padding-left:20px}
#pop{position:absolute;z-index:50;max-width:290px;background:var(--ink);color:#fff;border-radius:6px;padding:10px 28px 10px 12px;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#pop i{position:absolute;right:8px;top:4px;cursor:pointer;font-style:normal}
#dictbtn{position:fixed;right:16px;bottom:16px;z-index:40;background:var(--accent);color:#fff;border:0;border-radius:30px;padding:12px 18px;font:600 1rem 'Source Sans 3',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#dict{position:fixed;right:16px;bottom:70px;z-index:40;width:min(320px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#dict input{width:calc(100% - 70px);padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;font:inherit}
#dict button{padding:8px 10px;border:0;background:var(--ink);color:#fff;border-radius:6px;cursor:pointer;font:inherit}
#dres{margin-top:10px;min-height:24px}[hidden]{display:none!important}
</style></head><body>

  el.innerHTML='<span class="dim">Đang tra…</span>';
  const v=await tr(w);
  el.innerHTML=v?`<b>${esc(w)}</b> → ${esc(v)}`:'<span class="dim">Không tra được (kiểm tra kết nối mạng hoặc thử lại sau).</span>';
}
const STOP=new Set('the and or of to in on at for with by from as is are was were be been being that this these those which what who whom whose when where why how its their they them his her she you not only all any each every both either neither more most other than then also into over under about between during after before can could may might must shall should will would does did has have had first second best main primarily commonly according coursebook which'.split(' '));
function keywords(q){
  const seen=new Set(),out=[];
  for(const w of (q.q+' '+q.o[q.a]).match(/[A-Za-z][A-Za-z'-]{4,}/g)||[]){
    const c=w.replace(/'s$/i,''),k=c.toLowerCase();
    if(STOP.has(k)||seen.has(k))continue;seen.add(k);out.push(c);
  }
  return out.slice(0,7);
}
let S={list:[],i:0,ans:[],label:''};
function home(){
  const cnt=id=>DATA.qs.filter(q=>q.u===id).length;
  $('#app').innerHTML=`
  <div class="modes">
    <button class="mode" data-m="all"><h3>Làm tất cả</h3><p>${DATA.qs.length} câu theo thứ tự từ Unit 1 đến Unit ${DATA.units.length}.</p></button>
    <button class="mode" data-m="rand"><h3>Ngẫu nhiên 50 câu</h3><p>Bốc ngẫu nhiên 50 câu từ toàn bộ ngân hàng đề.</p></button>
  </div>
  <h2 class="sec">Làm theo chương</h2>
  <div class="units">${DATA.units.map(u=>`<button class="unit-btn" data-u="${u.id}"><b>Unit ${u.id} — ${esc(u.title)}</b><small>${cnt(u.id)} câu</small></button>`).join('')}</div>`;
  $('#app').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    if(b.dataset.m==='all')start(DATA.qs.slice(),'Tất cả các chương');
    else start(DATA.qs.slice().sort(()=>Math.random()-.5).slice(0,50),'Ngẫu nhiên 50 câu');
  });
  $('#app').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=+b.dataset.u;start(DATA.qs.filter(q=>q.u===u),'Unit '+u)});
}
function start(list,label){S={list,i:0,ans:[],label};scrollTo(0,0);render()}
function render(){
  const q=S.list[S.i],a=S.ans[S.i],done=S.ans.filter(x=>x!==undefined).length,ok=S.list.filter((x,i)=>S.ans[i]===x.a).length;
  $('#app').innerHTML=`
  <div class="bar"><div style="width:${done/S.list.length*100}%"></div></div>
  <div class="meta"><span>${esc(S.label)}</span><span>Câu ${S.i+1}/${S.list.length} (số gốc #${q.n})</span><span>Đúng: ${ok}/${done}</span></div>
  <article class="card"><p class="unit">Unit ${q.u} — ${esc(unitOf(q.u).title)}</p>
  <h2 id="qtext">${esc(q.q)}</h2>
  <ul class="opts">${q.o.map((t,k)=>{
    let c='';if(a!==undefined){if(k===q.a)c='ok';else if(k===a)c='bad'}
    return `<li><button class="opt ${c}" data-k="${k}" ${a!==undefined?'disabled':''}><b>${L[k]}</b><span>${esc(t)}</span></button></li>`}).join('')}</ul>
  <div id="exp"></div></article>
  <nav class="ctl"><button class="btn alt" id="prev" ${S.i===0?'disabled':''}>← Câu trước</button>
  <button class="btn alt" id="home">Trang chủ</button>
  <button class="btn" id="next">${S.i===S.list.length-1?'Xem kết quả':'Câu tiếp →'}</button></nav>`;
  $('#app').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#prev').onclick=()=>{S.i--;render()};$('#home').onclick=()=>{if(confirm('Thoát bài đang làm?'))home()};
  $('#next').onclick=()=>S.i===S.list.length-1?finish():(S.i++,render());
  if(a!==undefined)showExp(q,a);
}
function pick(k){if(S.ans[S.i]!==undefined)return;S.ans[S.i]=k;render()}
function showExp(q,a){
  const good=a===q.a,idx=S.i,kws=keywords(q);
  $('#exp').innerHTML=`
  <div class="verdict ${good?'ok':'bad'}">${good?'✓ Chính xác!':'✗ Chưa đúng — đáp án đúng là '+L[q.a]+'.'}</div>
  <div class="ex">
    <h4>Giải thích</h4>
    ${q.exp?`<p>${esc(q.exp)}</p>`:''}
    <p><b>${L[q.a]}.</b> ${esc(q.o[q.a])}</p>
    ${good?'':`<p class="dim">Bạn đã chọn ${L[a]}. ${esc(q.o[a])}</p>`}
    <h4>Bản dịch tiếng Việt</h4>
    <p class="vi" id="t1"><span class="dim">Đang dịch…</span></p><p class="vi" id="t2"></p>
    <h4>Từ quan trọng</h4>
    <div class="chips">${kws.map((w,i)=>`<span class="chip"><b>${esc(w)}</b>: <span id="kw${i}" class="dim">…</span></span>`).join('')}</div>
  </div>`;
  const live=id=>S.i===idx&&$(id);
  tr(q.q).then(v=>{const e=live('#t1');if(e)e.innerHTML=v?`<b>Hỏi:</b> ${esc(v)}`:'<span class="dim">Không dịch được (cần kết nối mạng) — hãy tô đen câu để tra.</span>'});
  tr(q.o[q.a]).then(v=>{const e=live('#t2');if(e&&v)e.innerHTML=`<b>Đáp án:</b> ${esc(v)}`});
  kws.forEach((w,i)=>tr(w.toLowerCase()===w?w:w).then(v=>{const e=live('#kw'+i);if(e){e.className='';e.textContent=v||'—'}}));
}
function finish(){
  const n=S.list.length,ok=S.list.filter((q,i)=>S.ans[i]===q.a).length,skip=S.ans.filter(x=>x===undefined).length;
  const wrong=S.list.map((q,i)=>({q,i})).filter(({q,i})=>S.ans[i]!==q.a);
  $('#app').innerHTML=`<div class="card score"><p class="unit">Kết quả — ${esc(S.label)}</p>
  <div class="big">${ok}/${n}</div><p>${Math.round(ok/n*100)}% chính xác${skip?` · ${skip} câu chưa làm`:''}</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0">
  ${wrong.length?'<button class="btn" id="redo">Làm lại các câu sai/chưa làm</button>':''}<button class="btn alt" id="home2">Về trang chủ</button></div></div>
  ${wrong.length?`<h2 class="sec" style="margin-top:24px">Các câu cần xem lại</h2><ol class="wrong">${wrong.map(({q})=>`<li><b>#${q.n}</b> ${esc(q.q)}<br><span class="dim">Đáp án đúng: ${L[q.a]}. ${esc(q.o[q.a])}</span></li>`).join('')}</ol>`:''}`;
  if($('#redo'))$('#redo').onclick=()=>start(wrong.map(w=>w.q),'Ôn lại câu sai');
  $('#home2').onclick=home;scrollTo(0,0);
}
/* Tra từ: tô đen để tra */
function sel(e){
  if(e.target.closest&&e.target.closest('#pop,#dict,#dictbtn'))return;
  setTimeout(()=>{
    const s=getSelection(),t=s.toString().trim(),p=$('#pop');
    if(!t||t.length>120||!s.rangeCount){p.hidden=true;return}
    const r=s.getRangeAt(0).getBoundingClientRect();
    p.hidden=false;p.style.left=Math.max(8,Math.min(innerWidth-300,r.left+scrollX))+'px';p.style.top=(r.bottom+scrollY+8)+'px';
    lookup(t,p.querySelector('div'));
  },15);
}
document.addEventListener('mouseup',sel);document.addEventListener('touchend',sel);
$('#dictbtn').onclick=()=>{const d=$('#dict');d.hidden=!d.hidden;if(!d.hidden)$('#din').focus()};
const go=()=>{const w=$('#din').value.trim();if(w)lookup(w,$('#dres'))};
$('#dgo').onclick=go;$('#din').onkeydown=e=>{if(e.key==='Enter')go()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||!S.list.length||!$('.opts'))return;
  const k=L.indexOf(e.key.toUpperCase());
  if(k>-1&&e.key.length===1)pick(k);
  else if(e.key==='ArrowRight'||e.key==='Enter')$('#next').click();
  else if(e.key==='ArrowLeft'&&S.i>0)$('#prev').click();
});
home();
</script></body></html>
